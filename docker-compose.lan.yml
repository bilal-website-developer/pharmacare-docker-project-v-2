services:
  api:
    environment:
      WEB_ORIGIN: https://${LAN_HOSTNAME:?Set LAN_HOSTNAME to the admin PC name}

  web:
    ports: !reset []

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      LAN_HOSTNAME: ${LAN_HOSTNAME:?Set LAN_HOSTNAME to the admin PC name}
    ports:
      - "443:443"
    volumes:
      - ./docker/Caddyfile.lan:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - frontend
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true

volumes:
  caddy_data:
  caddy_config:
