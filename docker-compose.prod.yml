services:
  mongo:
    restart: always
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /data/configdb:rw,noexec,nosuid,size=16m
    mem_limit: 2g
    cpus: 2.0

  mongo-init:
    restart: "no"

  mongo-backup:
    restart: always
    environment:
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    mem_limit: 512m
    cpus: 0.5

  api:
    image: ${PHARMA_API_IMAGE:?Set PHARMA_API_IMAGE to an immutable release tag}
    environment:
      WEB_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the public hostname}
    mem_limit: 1g
    cpus: 1.0

  web:
    image: ${PHARMA_WEB_IMAGE:?Set PHARMA_WEB_IMAGE to an immutable release tag}
    ports: !reset []
    mem_limit: 256m
    cpus: 0.5

  caddy:
    image: caddy:2.10-alpine
    restart: always
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to the public hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate registration}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - frontend
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 256m
    cpus: 0.5

volumes:
  caddy_data:
  caddy_config:
