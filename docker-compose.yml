services:
  mongo:
    image: mongo:8.0.12
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Run docker/generate-secrets.ps1 first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run docker/generate-secrets.ps1 first}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?Run docker/generate-secrets.ps1 first}
    entrypoint: ["/bin/sh", "/opt/pharmacare/mongo-entrypoint.sh"]
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-entrypoint.sh:/opt/pharmacare/mongo-entrypoint.sh:ro
    tmpfs:
      - /run/mongo-auth
    networks:
      - database
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  mongo-init:
    image: pharma-care-api:local
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["node", "dist/scripts/init-mongo.js"]
    environment:
      NODE_ENV: production
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_APP_DB: ${MONGO_APP_DB:?MONGO_APP_DB is required}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - database
    security_opt:
      - no-new-privileges:true

  api:
    image: pharma-care-api:local
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_APP_DB: ${MONGO_APP_DB:?MONGO_APP_DB is required}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER is required}
      SETUP_CODE_HASH: ${SETUP_CODE_HASH:-}
      SETUP_CODE_EXPIRES_AT: ${SETUP_CODE_EXPIRES_AT:-}
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    networks:
      - frontend
      - database
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  api-test:
    image: pharma-care-api-test:local
    build:
      context: ./server
      dockerfile: Dockerfile
      target: build
    profiles: ["test"]
    command: ["npm", "run", "test:mongo-integration"]
    restart: "no"
    environment:
      NODE_ENV: test
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_APP_DB: ${MONGO_APP_DB:?MONGO_APP_DB is required}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER is required}
      SETUP_CODE_HASH: ${SETUP_CODE_HASH:-}
      SETUP_CODE_EXPIRES_AT: ${SETUP_CODE_EXPIRES_AT:-}
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    networks:
      - database
    security_opt:
      - no-new-privileges:true

  web:
    image: pharma-care-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_BACKEND: ${VITE_BACKEND:-api}
        VITE_SHOP_SLUG: ${VITE_SHOP_SLUG:-main}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

networks:
  frontend:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  mongo_data:
