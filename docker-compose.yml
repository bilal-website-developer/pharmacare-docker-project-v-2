services:
  mongo:
    image: mongo:8.0.12
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Run docker/generate-secrets.ps1 first}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run docker/generate-secrets.ps1 first}
      MONGO_REPLICA_KEY: ${MONGO_REPLICA_KEY:?Run docker/generate-secrets.ps1 first}
    entrypoint: ["/bin/sh", "/opt/pharmacare/mongo-entrypoint.sh"]
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-entrypoint.sh:/opt/pharmacare/mongo-entrypoint.sh:ro
    tmpfs:
      - /run/mongo-auth
    networks:
      - database
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --host 127.0.0.1 --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  mongo-init:
    image: pharma-care-api:local
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["node", "dist/scripts/init-mongo.js"]
    environment:
      NODE_ENV: production
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_APP_DB: ${MONGO_APP_DB:?MONGO_APP_DB is required}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      MONGO_BACKUP_USERNAME: ${MONGO_BACKUP_USERNAME:?MONGO_BACKUP_USERNAME is required}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?MONGO_BACKUP_PASSWORD is required}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - database
    security_opt:
      - no-new-privileges:true

  mongo-backup:
    image: mongo:8.0.12
    profiles: ["backup"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/pharmacare/mongo-backup.sh"]
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_APP_DB: ${MONGO_APP_DB:?MONGO_APP_DB is required}
      MONGO_BACKUP_USERNAME: ${MONGO_BACKUP_USERNAME:?MONGO_BACKUP_USERNAME is required}
      MONGO_BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:?MONGO_BACKUP_PASSWORD is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - mongo_backups:/backups
      - ./docker/mongo-backup.sh:/opt/pharmacare/mongo-backup.sh:ro
    tmpfs:
      - /run/mongo-backup:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - database
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -s /backups/last-success && [ $$(($(date +%s) - $$(stat -c %Y /backups/last-success))) -lt $$((BACKUP_INTERVAL_SECONDS * 2)) ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10m
    security_opt:
      - no-new-privileges:true
    read_only: true

  mongo-restore-scratch:
    image: mongo:8.0.12
    profiles: ["backup-restore"]
    command: ["mongod", "--bind_ip_all"]
    tmpfs:
      - /data/db
      - /tmp
    networks:
      - database
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "127.0.0.1", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  api:
    image: pharma-care-api:local
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_APP_DB: ${MONGO_APP_DB:?MONGO_APP_DB is required}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER is required}
      BOOTSTRAP_SHOP_SLUG: ${BOOTSTRAP_SHOP_SLUG:-main}
      SETUP_CODE_HASH: ${SETUP_CODE_HASH:-}
      SETUP_CODE_EXPIRES_AT: ${SETUP_CODE_EXPIRES_AT:-}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-}
      LICENCE_PUBLIC_KEY: ${LICENCE_PUBLIC_KEY:-}
      UPDATER_CONFIG_PATH: ${UPDATER_CONFIG_PATH:-/app/updates/update-config.json}
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - type: bind
        source: ${UPDATES_DIRECTORY:-./updates}
        target: /app/updates
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    networks:
      - frontend
      - database
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  api-test:
    image: pharma-care-api-test:local
    build:
      context: ./server
      dockerfile: Dockerfile
      target: build
    profiles: ["test"]
    command: ["npm", "run", "test:mongo-integration"]
    restart: "no"
    environment:
      NODE_ENV: test
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_APP_DB: ${MONGO_APP_DB:?MONGO_APP_DB is required}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER is required}
      BOOTSTRAP_SHOP_SLUG: ${BOOTSTRAP_SHOP_SLUG:-main}
      SETUP_CODE_HASH: ${SETUP_CODE_HASH:-}
      SETUP_CODE_EXPIRES_AT: ${SETUP_CODE_EXPIRES_AT:-}
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    networks:
      - database

  demo-seed:
    image: pharma-care-api:local
    build:
      context: ./server
      dockerfile: Dockerfile
    profiles: ["demo-seed"]
    command: ["node", "dist/scripts/seed-demo.js"]
    environment:
      NODE_ENV: ${DEMO_NODE_ENV:-production}
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_APP_DB: ${MONGO_APP_DB:?MONGO_APP_DB is required}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:?REFRESH_TOKEN_PEPPER is required}
      BOOTSTRAP_SHOP_SLUG: ${BOOTSTRAP_SHOP_SLUG:-main}
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  web:
    image: pharma-care-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_BACKEND: ${VITE_BACKEND:-api}
        VITE_SHOP_SLUG: ${VITE_SHOP_SLUG:-main}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

networks:
  frontend:
    driver: bridge
  database:
    driver: bridge
    internal: true

volumes:
  mongo_data:
  mongo_backups:
